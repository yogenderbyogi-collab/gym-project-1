<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - MyGym</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Barlow', sans-serif; background: #0a0a0a; color: white; display: flex; height: 100vh; }

        .left-panel {
            flex: 1;
            background: url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=800') center/cover no-repeat;
            position: relative;
        }
        .left-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
        }
        .left-brand {
            position: absolute;
            bottom: 40px;
            left: 40px;
            z-index: 2;
        }
        .left-brand h2 {
            font-family: 'Bebas Neue';
            font-size: 3rem;
            letter-spacing: 3px;
            line-height: 1;
        }
        .left-brand h2 span { color: #e63329; }
        .left-brand p { color: #aaa; font-size: 0.9rem; font-weight: 300; margin-top: 8px; }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px 60px;
            overflow-y: auto;
        }

        h1 { font-family: 'Bebas Neue'; font-size: 2.5rem; letter-spacing: 2px; margin-bottom: 8px; }
        h1 span { color: #e63329; }
        .subtitle { color: #888; font-size: 0.9rem; font-weight: 300; margin-bottom: 32px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.8rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #888; margin-bottom: 8px; }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.08);
            color: white;
            padding: 14px 18px;
            font-family: 'Barlow';
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus { border-color: #e63329; }
        input::placeholder { color: #444; }

        .btn-signup {
            width: 100%;
            padding: 16px;
            background: #e63329;
            color: white;
            border: none;
            font-family: 'Barlow';
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.3s;
        }
        .btn-signup:hover { background: #c0251b; }

        .login-text {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 0.85rem;
        }
        .login-text a { color: #e63329; text-decoration: none; font-weight: 600; }

        .error-msg {
            background: rgba(230,51,41,0.15);
            border: 1px solid #e63329;
            color: #e63329;
            padding: 12px 16px;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .success-msg {
            background: rgba(40,167,69,0.15);
            border: 1px solid #28a745;
            color: #28a745;
            padding: 12px 16px;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="left-panel">
        <div class="left-brand">
            <h2>My<span>Gym</span></h2>
            <p>Start your fitness journey today.</p>
        </div>
    </div>

    <div class="right-panel">
        <h1>Create <span>Account</span></h1>
        <p class="subtitle">Join thousands of members achieving their fitness goals.</p>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="success-msg">{{ success }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="first_name" placeholder="John" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="last_name" placeholder="Doe" required>
                </div>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="johndoe123" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="john@example.com" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password1" placeholder="Min. 8 characters" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="password2" placeholder="Repeat password" required>
                </div>
            </div>
            <button type="submit" class="btn-signup">Create My Account →</button>
        </form>

        <p class="login-text">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
    </div>

</body>
</html>
