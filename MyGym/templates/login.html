<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MyGym</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display: flex; height: 100vh; background-color: #0a0a0a; color: white; font-family: 'Barlow', sans-serif; }

        .left-panel {
            flex: 1;
            background-image: url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=800');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .left-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
        }
        .left-brand {
            position: absolute;
            bottom: 40px;
            left: 40px;
            z-index: 2;
        }
        .left-brand h2 {
            font-family: 'Bebas Neue';
            font-size: 3rem;
            letter-spacing: 3px;
            line-height: 1;
        }
        .left-brand h2 span { color: #e63329; }
        .left-brand p { color: #aaa; font-size: 0.9rem; font-weight: 300; margin-top: 8px; }

        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
        }

        h1 { font-family: 'Bebas Neue'; font-size: 2.5rem; letter-spacing: 2px; margin-bottom: 8px; }
        h1 span { color: #e63329; }

        .subtitle { color: #888; font-size: 0.9rem; font-weight: 300; margin-bottom: 40px; }

        .form-group { margin-bottom: 20px; }

        label { display: block; font-size: 0.8rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #888; margin-bottom: 8px; }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.08);
            color: white;
            font-family: 'Barlow';
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus { border-color: #e63329; }

        input::placeholder { color: #444; }

        .forgot { text-align: right; margin-top: 6px; }
        .forgot a { color: #e63329; font-size: 0.8rem; text-decoration: none; }

        .remember { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #aaa; margin-bottom: 24px; }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: #e63329;
            color: white;
            font-family: 'Barlow';
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-login:hover { background: #c0251b; }

        .signup-text { text-align: center; margin-top: 24px; color: #888; font-size: 0.85rem; }
        .signup-text a { color: #e63329; text-decoration: none; font-weight: 600; }

        .error-msg {
            background: rgba(230,51,41,0.15);
            border: 1px solid #e63329;
            color: #e63329;
            padding: 12px 16px;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 24px 0;
            color: #555;
            font-size: 0.8rem;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #333; }

        .home-link {
            text-align: center;
            margin-top: 16px;
        }
        .home-link a {
            color: #555;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: color 0.3s;
        }
        .home-link a:hover { color: #e63329; }
    </style>
</head>
<body>

    <div class="left-panel">
        <div class="left-brand">
            <h2>My<span>Gym</span></h2>
            <p>Live Your Best Life.</p>
        </div>
    </div>

    <div class="right-panel">
        <h1>Welcome to <span>MyGym.</span></h1>
        <p class="subtitle">We provide access to the best fitness and wellness services in your zone.</p>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter your password" required>
                <div class="forgot"><a href="#">Forgot Password?</a></div>
            </div>
            <div class="remember">
                <input type="checkbox" id="remember">
                <label for="remember" style="margin:0">Remember me</label>
            </div>
            <button type="submit" class="btn-login">Login →</button>
        </form>

        <p class="signup-text">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>

        <div class="divider">Or</div>

        <div class="home-link">
            <a href="{% url 'home' %}">← Back to Home</a>
        </div>
    </div>

</body>
</html>
