<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyGym - Live Your Best Life</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ALL YOUR CSS STYLES */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --red: #e63329; --dark: #0a0a0a; --gray: #1a1a1a; }
        body { font-family: 'Barlow', sans-serif; background: var(--dark); color: white; overflow-x: hidden; }

        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 60px;
            background: rgba(10,10,10,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo { font-family: 'Bebas Neue'; font-size: 2rem; letter-spacing: 3px; }
        .logo span { color: var(--red); }
        .nav-links { display: flex; gap: 40px; list-style: none; }
        .nav-links a { color: #aaa; text-decoration: none; font-size: 0.85rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; transition: color 0.3s; }
        .nav-links a:hover { color: white; }
        .nav-btn { background: var(--red); color: white; border: none; padding: 12px 28px; font-family: 'Barlow'; font-size: 0.8rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; text-decoration: none; }

        #home { min-height: 100vh; display: flex; align-items: center; position: relative; padding-top: 80px; }
        .hero-bg { position: absolute; inset: 0; background: url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=1400') center/cover; filter: brightness(0.3); }
        .hero-content { position: relative; z-index: 2; padding: 0 60px; max-width: 700px; }
        .hero-tag { font-size: 0.75rem; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: var(--red); margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
        .hero-tag::before { content: ''; width: 40px; height: 2px; background: var(--red); }
        .hero-title { font-family: 'Bebas Neue'; font-size: clamp(4rem, 8vw, 7rem); line-height: 0.95; margin-bottom: 24px; }
        .hero-title span { color: var(--red); }
        .hero-desc { font-size: 1rem; font-weight: 300; color: #aaa; line-height: 1.8; max-width: 480px; margin-bottom: 40px; }
        .hero-btns { display: flex; gap: 16px; margin-bottom: 60px; }
        .btn-primary { background: var(--red); color: white; border: none; padding: 16px 36px; font-family: 'Barlow'; font-size: 0.85rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-outline { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.3); padding: 16px 36px; font-family: 'Barlow'; font-size: 0.85rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; display: inline-block; }
        .hero-stats { display: flex; gap: 48px; }
        .stat-num { font-family: 'Bebas Neue'; font-size: 2.5rem; color: var(--red); line-height: 1; }
        .stat-label { font-size: 0.75rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #666; margin-top: 4px; }

        section { padding: 100px 60px; }
        .section-tag { font-size: 0.75rem; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: var(--red); margin-bottom: 16px; display: flex; align-items: center; gap: 12px; }
        .section-tag::before { content: ''; width: 30px; height: 2px; background: var(--red); }
        .section-title { font-family: 'Bebas Neue'; font-size: clamp(2.5rem, 5vw, 4rem); margin-bottom: 16px; }
        .section-desc { font-size: 1rem; font-weight: 300; color: #888; line-height: 1.8; max-width: 520px; margin-bottom: 60px; }

        #services { background: #050505; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 2px; }
        .service-card { background: var(--gray); padding: 40px 32px; border-top: 2px solid transparent; transition: all 0.3s; }
        .service-card:hover { border-top-color: var(--red); background: #222; }
        .service-name { font-family: 'Bebas Neue'; font-size: 1.5rem; margin-bottom: 12px; margin-top: 20px; }
        .service-text { font-size: 0.9rem; font-weight: 300; color: #888; line-height: 1.7; }

        #support { background: var(--dark); }
        .support-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
        .support-img { position: relative; height: 500px; }
        .support-img img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.7); }
        .support-img-tag { position: absolute; bottom: 32px; left: 32px; background: var(--red); padding: 16px 24px; }
        .support-img-tag strong { font-family: 'Bebas Neue'; font-size: 2rem; display: block; line-height: 1; }
        .support-img-tag span { font-size: 0.75rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; opacity: 0.8; }
        .feature-item { display: flex; gap: 20px; padding: 24px; border: 1px solid rgba(255,255,255,0.06); margin-bottom: 16px; transition: border-color 0.3s; }
        .feature-item:hover { border-color: rgba(230,51,41,0.4); }
        .feature-num { font-family: 'Bebas Neue'; font-size: 2rem; color: var(--red); line-height: 1; min-width: 48px; }
        .feature-title { font-weight: 700; font-size: 1rem; text-transform: uppercase; margin-bottom: 6px; }
        .feature-text { font-size: 0.875rem; font-weight: 300; color: #888; line-height: 1.6; }

        #contact { background: #050505; }
        .contact-layout { display: grid; grid-template-columns: 1fr 1.4fr; gap: 80px; }
        .contact-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #555; margin-bottom: 4px; margin-top: 24px; }
        .contact-value { font-size: 0.95rem; color: #ccc; }
        .contact-form { display: flex; flex-direction: column; gap: 16px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .contact-form input, .contact-form textarea, .contact-form select { width: 100%; background: #111; border: 1px solid rgba(255,255,255,0.08); color: white; padding: 14px 18px; font-family: 'Barlow'; font-size: 0.9rem; outline: none; transition: border-color 0.3s; }
        .contact-form input:focus, .contact-form textarea:focus { border-color: var(--red); }
        .contact-form input::placeholder, .contact-form textarea::placeholder { color: #444; }
        .contact-form textarea { height: 120px; resize: none; }
        .contact-form select { color: #aaa; }

        footer { background: #050505; padding: 40px 60px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); }
        .footer-logo { font-family: 'Bebas Neue'; font-size: 1.5rem; letter-spacing: 3px; }
        .footer-logo span { color: var(--red); }
        .footer-text { font-size: 0.8rem; color: #444; }
    </style>
</head>
<body>

<nav>
    <div class="logo">My<span>Gym</span></div>
    <ul class="nav-links">
        <li><a href="{% url 'home' %}">Home</a></li>
        <li><a href="{% url 'services' %}">Services</a></li>
        <li><a href="{% url 'support' %}">Support</a></li>
        <li><a href="{% url 'contact' %}">Contact</a></li>
    </ul>
    {% if user.is_authenticated %}
    <div style="display:flex; align-items:center; gap:16px;">
        <span style="color:#aaa; font-size:0.85rem; font-weight:600; letter-spacing:1px;">
            👋 {{ user.first_name|default:user.username }}
        </span>
        <a href="{% url 'dashboard' %}" class="nav-btn" style="background:#555;">Dashboard</a>
        <a href="{% url 'logout' %}" class="nav-btn">Logout</a>
    </div>
    {% else %}
    <a href="{% url 'login' %}" class="nav-btn">Login</a>
    {% endif %}
</nav>

<div class="main-content">
    {% block content %}
    {% endblock content %}
</div>

<footer>
    <div class="footer-logo">My<span>Gym</span></div>
    <div class="footer-text">© 2026 MyGym. All rights reserved.</div>
</footer>

</body>
</html>
